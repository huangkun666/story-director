<div id="story_director_panel" class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <div class="flex-container alignitemscenter margin0">
            <b>叙事导演 (Story Director)</b>
        </div>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div id="sd_toolbar" class="sd_toolbar">
            <div id="sd_generate" class="menu_button" title="读取当前角色卡生成整场大纲"><i class="fa-solid fa-wand-magic-sparkles"></i><span>生成大纲</span></div>
            <div id="sd_revise" class="menu_button" title="手动触发一次情节追踪"><i class="fa-solid fa-rotate"></i><span>修订</span></div>
            <div id="sd_check" class="menu_button" title="检查大纲与剧情的同步性"><i class="fa-solid fa-stethoscope"></i><span>体检</span></div>
            <div id="sd_clear" class="menu_button" title="清空大纲"><i class="fa-solid fa-trash"></i><span>清空</span></div>
            <label class="sd_enable"><input id="sd_enabled" type="checkbox" /><span>启用</span></label>
        </div>
        <div id="sd_overview" class="sd_overview"><small>尚未生成大纲。点击"生成大纲"开始。</small></div>
        <div id="sd_focus" class="sd_focus"></div>
        <div id="sd_report" class="sd_report"></div>
        <details class="sd_llm_settings sd_settings_group">
            <summary>参数设置</summary>
            <label class="sd_llm_row">控制强度
                <select id="sd_control_strength">
                    <option value="weak">弱引导</option>
                    <option value="strong">强约束</option>
                </select>
            </label>
            <label class="sd_llm_row">注入指令长度上限（近似 token）
                <input id="sd_inject_limit" type="number" min="0" max="4000" step="10" />
            </label>
            <label class="sd_llm_row">修订节奏
                <select id="sd_revise_frequency">
                    <option value="every">每轮</option>
                    <option value="everyN">每 N 轮</option>
                    <option value="manual">仅手动</option>
                </select>
            </label>
            <label class="sd_llm_row" id="sd_revise_every_n_row">每 N 轮
                <input id="sd_revise_every_n" type="number" min="1" max="20" step="1" />
            </label>
            <label class="sd_llm_row">偏离处理
                <select id="sd_drift_tolerance">
                    <option value="loose">宽松吸收</option>
                    <option value="strict">严格拉回</option>
                </select>
            </label>
            <label class="sd_llm_row">大纲详细度
                <select id="sd_outline_detail">
                    <option value="low">低</option>
                    <option value="medium">中</option>
                    <option value="high">高</option>
                </select>
            </label>
            <label class="sd_llm_row">修订回顾轮数
                <input id="sd_recent_turns" type="number" min="1" max="50" step="1" />
            </label>
        </details>
        <details class="sd_llm_settings">
            <summary>独立 API 设置</summary>
            <label class="sd_llm_row">模式
                <select id="sd_llm_mode">
                    <option value="main">复用主 API</option>
                    <option value="custom">独立配置</option>
                </select>
            </label>
            <div id="sd_llm_fields">
                <label class="sd_llm_row">API 类型
                    <input id="sd_llm_api" type="text" placeholder="openai / textgenerationwebui" />
                </label>
                <label class="sd_llm_row">Base URL
                    <input id="sd_llm_base_url" type="text" placeholder="https://your-proxy.example/v1" />
                </label>
                <label class="sd_llm_row">API Key
                    <input id="sd_llm_api_key" type="password" autocomplete="off" placeholder="sk-..." />
                </label>
                <label class="sd_llm_row">模型
                    <input id="sd_llm_model" type="text" placeholder="留空使用服务端默认模型" />
                </label>
                <small>custom 模式通过 OpenAI 兼容接口 /v1/chat/completions 直连；配置错误时静默降级为沿用旧大纲。</small>
            </div>
        </details>
    </div>
</div>
